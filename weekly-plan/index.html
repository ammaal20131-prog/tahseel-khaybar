/* === sheet: same layout as the ministry template the school shared === */
:root{--s-paper:#ffffff;--s-ink:#26313a;--s-muted:#55606a;--s-line:#d5dbdf;--s-head:#7b5a98;--s-green:#8a6aa6;--s-subj:#f3eef7;--s-subj-ink:#4f4058;--s-icon:#7b5a98}
.sheet{background:var(--s-paper);color:var(--s-ink);border:1px solid var(--s-line);border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.12);padding:18px;gap:14px}
.sheet .sheet-head{background:var(--s-head);color:#fff;border-radius:12px;padding:18px 20px;grid-template-columns:1fr auto 1fr}
.sheet .moe{flex-direction:row;align-items:center;gap:10px;border:0;padding:0}
.sheet .moe img.logo{height:68px;width:auto;max-width:170px;object-fit:contain}
.sheet .moe:has(img.logo) div{display:none}
.sheet .moe div{display:flex;flex-direction:column;line-height:1.25}
.sheet .moe b{font-size:16px}
.sheet .moe span{font-family:var(--f-body);font-style:normal;font-size:10px;opacity:.85}
.sheet .ttl h1{font-size:clamp(22px,4vw,32px);color:#fff}
.sheet .subtitle{font-size:17px;opacity:1;color:#fff}
.sheet .info{grid-template-columns:2.2fr 1fr 1.3fr}
.sheet .ibox{border:1.5px solid var(--s-line);border-radius:10px;padding:10px 14px;color:var(--s-ink);font-size:13.5px}
.sheet .ibox svg{color:var(--s-head)}
.sheet .ibox small{color:var(--s-muted)}
.sheet .tablebox{border:1px solid var(--s-line);border-radius:0;background:var(--s-paper)}
.sheet table{table-layout:fixed}
.sheet thead th{background:var(--s-green);color:#fff;text-align:center;font-size:14px;padding:10px 8px;border-left:1px solid rgba(255,255,255,.35)}
.sheet thead th:nth-child(1){width:15%}.sheet thead th:nth-child(2){width:25%}.sheet thead th:nth-child(3){width:38%}.sheet thead th:nth-child(4){width:22%}
.sheet td{border-bottom:1px solid var(--s-line);border-left:1px solid var(--s-line);color:var(--s-ink);background:var(--s-paper);padding:10px 12px;vertical-align:middle}
.sheet tbody tr:nth-child(even) td:not(.subj){background:var(--s-paper)}
.sheet td.subj{background:var(--s-subj);text-align:center}
.sheet .sname{color:var(--s-subj-ink);font-family:var(--f-display);font-weight:600;font-size:14px;line-height:1.4;min-width:0;gap:8px}
.sheet .sname svg{color:var(--s-icon);width:32px;height:32px}
.sheet td ul{list-style:none;padding:0;gap:4px}
.sheet td li{position:relative;padding-inline-start:14px}
.sheet td li::before{content:"";position:absolute;right:0;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--s-ink)}
.sheet td.lesson{font-size:13.5px}
.sheet td.goals{font-size:12.5px;color:var(--s-ink)}
.sheet td.hw{text-align:center;color:var(--s-muted);font-size:13px}
.sheet .sign span{color:var(--s-head)}
.sheet .sign b{border-top-color:var(--s-line);color:var(--s-ink)}
.sheet .sigbox em,.sheet .stampbox em{color:var(--s-muted);border-color:var(--s-line)}
.sheet .none{color:var(--s-muted)}
.sheet .tag{background:#fbf0dc;color:#8a5a10}
.sheet .empty{color:var(--s-muted)}
@media (max-width:640px){
  .sheet{padding:10px}
  .sheet .sheet-head{grid-template-columns:1fr;text-align:center;padding:14px}
  .sheet .moe{justify-content:center}
  .sheet .spacer{display:none}
  .sheet .info{grid-template-columns:1fr}
  .sheet .tablebox{border:0}
  .sheet tr{border-color:var(--s-line);background:var(--s-paper)}
  .sheet td{border:0;text-align:right}
  .sheet td.subj{border-bottom:1px solid var(--s-line)}
  .sheet td.hw{text-align:right}
  .sheet .sname{flex-direction:row-reverse;justify-content:flex-end}
  .sheet .sname svg{width:24px;height:24px}
  .sheet td[data-k]::before{color:var(--s-muted)}
}

.tabrow{display:flex;gap:10px;max-width:1040px;margin:0 auto;width:max-content;min-width:min(100%,1040px)}
.tab{border:0;background:var(--tab);color:var(--ink);border-radius:999px;padding:12px 22px;font-size:16px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"],.tab.on{background:var(--sun);color:var(--on-sun);font-weight:600}
main .wrap{gap:18px}
.due{background:var(--plum);color:var(--on-plum);border-radius:26px;padding:18px 22px 22px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;position:relative}
.due-top{display:flex;align-items:center;gap:8px;font-size:16px}
.due select{background:transparent;color:var(--on-plum);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;font-weight:700;font-size:16px}
.due select option{color:#222}
.due-range{font-family:var(--f-display);font-weight:600;font-size:16px}
.due-badge{background:var(--badge);color:var(--on-sun);border-radius:999px;padding:8px 18px;font-weight:700;margin-top:6px;position:relative;z-index:1}
.wave{width:100%;height:12px;color:var(--sun);margin-top:-14px}
.card{background:var(--card);border-radius:32px;padding:26px 18px;box-shadow:6px 0 0 var(--card-edge);display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--f-hero);font-weight:800;font-size:clamp(24px,6vw,32px);margin:0 6px}
.lead{margin:-6px 6px 4px;color:var(--muted)}
.step{background:var(--cream);border-radius:26px;padding:18px 16px;display:flex;gap:12px;align-items:flex-start}
.step.alt{background:var(--peach)}
.star{position:relative;flex:none;width:46px;height:46px;display:grid;place-items:center}
.star svg{position:absolute;inset:0;fill:var(--sun)}
.star b{position:relative;font-family:var(--f-hero);font-size:18px;color:var(--on-sun)}
.step-body{min-width:0;flex:1}
.step h3{font-family:var(--f-hero);font-weight:800;font-size:21px;margin:6px 0 8px}
.kv{margin-bottom:8px}
.kv .k{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:2px}
.kv ul{margin:0;padding-inline-start:18px}
.kv li{margin:2px 0}
.hwchip{display:inline-block;background:var(--card);border:1.5px solid var(--card-edge);border-radius:18px;padding:8px 14px;margin:4px 0 0;font-size:14px}
.hwchip.warn{background:var(--warnbg);color:var(--warnfg);border-color:transparent}
.pnote{color:var(--muted);font-size:13px;margin:6px 0 0}
.sign2{display:flex;justify-content:flex-end;align-items:center;gap:18px;flex-wrap:wrap;padding:8px 6px 0}
.sign2 div{display:flex;flex-direction:column;align-items:center}
.sign2 span{font-weight:600;color:var(--muted);font-size:13px}
.sign2 .sig{width:150px;height:auto}
.sign2 .stamp{width:110px;height:auto}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
main .sheet{display:none}
.pdfcap .sheet{display:flex!important}
body.printmode .v2,body.printmode .hero,body.printmode .tabs{display:none!important}
body.printmode main .sheet{display:flex}
@media print{.v2,.hero,.tabs{display:none!important}main .sheet{display:flex!important}}

function mutate(fn){if(!draft)draft=clone(PUB);fn(draft);lsSet(draft);render()}
function curWeek(d){return weekOf(d,state.week)}
function newId(){return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function val(id){var e=document.getElementById(id);return e?e.value.trim():""}
function addRows(list){var added=0,dup=0;mutate(function(d){var w=curWeek(d);list.forEach(function(r){
  if(w.rows.some(function(x){return x.cls===r.cls&&x.subject===r.subject&&x.lesson===r.lesson})){dup++;return}
  r.id=newId();w.rows.push(r);added++})});toast("أُضيفت "+added+" حصة"+(dup?" وتُجوهلت "+dup+" مكررة":""))}
function parseLines(t){var out=[];t.split(/\r?\n/).forEach(function(line){if(!line.trim())return;
  var p=line.indexOf("\t")>=0?line.split("\t"):line.indexOf("|")>=0?line.split("|"):line.split(",");
  p=p.map(function(s){return s.trim().replace(/^"|"$/g,"")});
  if(DAYS.indexOf(p[0])>=0)p.shift();
  if(p.length<2||!p[0]||!p[1])return;
  out.push({cls:state.cls,day:"",subject:p[0],lesson:p[1],hw:p[2]||"",proj:p[3]||"",test:p[4]||"",note:p[5]||""})});return out}
function planText(){var d=data(),w=curWeek(d),c=d.classes.filter(function(x){return x.id===state.cls})[0];
  var gs=bySubject(sortRows(w.rows.filter(function(r){return r.cls===state.cls}),d));
  var s="الخطة الأسبوعية – "+d.school+"\n"+clsLabel(c)+" · الأسبوع "+w.num+"\n"+w.range+"\n";
  gs.forEach(function(g){s+="\n*"+g.subject+"*\n";g.lessons.forEach(function(l){s+="• "+l+"\n"});if(g.hw.length)s+="الواجب: "+g.hw.join("، ")+"\n";if(g.extra.length)s+=g.extra.join("، ")+"\n"});
  return s}
function buildDoc(d){
  var json=JSON.stringify(d).replace(/</g,"\\u003c");
  var head='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
  return head+'<title>'+TITLE+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="'+FONTS+'">\n<style id="page-style">'+STYLE+'</style>\n<div id="app"></div>\n<script type="application/json" id="plan-data">'+json+'<\/script>\n<script id="app-js">'+JS+'<\/script></body></html>';
}

document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
  if(b.dataset.cls){state.cls=b.dataset.cls;try{history.replaceState(null,"","#"+state.cls)}catch(x){}render();return}
  if(b.dataset.edit){editingId=b.dataset.edit;render();document.getElementById("fsub").scrollIntoView({block:"center"});return}
  if(b.dataset.del){var id=b.dataset.del;mutate(function(d){var w=curWeek(d);w.rows=w.rows.filter(function(r){return r.id!==id})});toast("حُذفت الحصة من المسودة");return}
  var a=b.dataset.act;
  if(a==="copy"){var t=planText();var done=function(){toast("نُسخت الخطة، الصقيها في مجموعة الواتساب")};
    try{navigator.clipboard.writeText(t).then(done,function(){fallback(t)})}catch(x){fallback(t)}}
  else if(a==="print"){printMode=true;render()}
  else if(a==="print-off"){printMode=false;render()}
  else if(a==="admin"){adminOpen=true;draft=lsGet()||clone(PUB);render()}
  else if(a==="admin-close"){adminOpen=false;confirming=false;editingId=null;render()}
  else if(a==="row-save"){var r={cls:state.cls,day:"",subject:val("fsub"),lesson:val("flesson"),hw:val("fhw"),proj:val("fproj"),test:val("ftest"),note:val("fnote"),goals:(document.getElementById("fgoals")||{value:""}).value.trim()};
    if(!r.subject||!r.lesson){toast("اكتبي اسم المادة وعنوان الدرس");return}
    if(editingId){var id2=editingId;editingId=null;mutate(function(d){var w=curWeek(d);w.rows.forEach(function(x){if(x.id===id2){r.day=x.day;Object.assign(x,r)}})});toast("حُفظ التعديل في المسودة")}
    else addRows([r])}
  else if(a==="row-cancel"){editingId=null;render()}
  else if(a==="paste"){var list=parseLines(val("paste"));if(!list.length){toast("لم أجد أسطرًا صالحة. اكتبي في كل سطر المادة ثم الدرس");return}addRows(list)}
  else if(a==="week-save"){var nums=val("wnum"),rng=val("wrange"),nt=val("wnote"),pr=val("wprin");mutate(function(d){d.principal=pr;var w=curWeek(d);w.num=+nums||w.num;w.range=rng;w.note=nt;w.days=w.days||{};
});toast("حُفظت بيانات الأسبوع في المسودة")}
  else if(a==="week-new"){mutate(function(d){var last=d.weeks[d.weeks.length-1];var n=(last?last.num:0)+1;var w={id:"w"+n+"-"+Date.now().toString(36),num:n,range:"",days:{},note:last?last.note:"",rows:[]};d.weeks.push(w);state.week=w.id});toast("أُنشئ أسبوع جديد. اكتبي فترته من «الأسبوع والصفوف»")}
  else if(a==="cls-add"){var g=val("ngrade"),sc=val("nsec");if(!sc){toast("اكتبي رقم الفصل");return}
    mutate(function(d){var id="c"+Date.now().toString(36);d.classes.push({id:id,grade:g,section:sc});state.cls=id})}
  else if(a==="review"){confirming=true;render()}
  else if(a==="confirm-off"){confirming=false;render()}
  else if(a==="discard"){draft=clone(PUB);lsSet(null);render();toast("أُلغيت المسودة")}
  else if(a==="publish"){publish()}
  else if(a==="sig-del"){mutate(function(d){delete d.signature})}
  else if(a==="stamp-del"){mutate(function(d){delete d.stamp})}
  else if(a==="logo-del"){mutate(function(d){delete d.logo})}
  else if(a==="pdf"){makePdf(b)}
});
document.addEventListener("change",function(e){
  if((e.target.id==="fsig"||e.target.id==="fstamp"||e.target.id==="flogo")&&e.target.files[0]){var key={fsig:"signature",fstamp:"stamp",flogo:"logo"}[e.target.id];
    shrinkImage(e.target.files[0],key==="signature"?480:400).then(function(url){mutate(function(d){d[key]=url});toast({stamp:"أُضيف الختم إلى المسودة",signature:"أُضيف التوقيع إلى المسودة",logo:"أُضيف الشعار إلى المسودة"}[key])},function(){toast("تعذّرت قراءة الصورة")});return}if(e.target.id==="weeksel"){state.week=e.target.value;render()}
  if(e.target.id==="filein"&&e.target.files[0]){var f=e.target.files[0];var rd=new FileReader();rd.onload=function(){var list=parseLines(String(rd.result));if(!list.length)toast("لم أجد أسطرًا صالحة في الملف");else addRows(list)};rd.readAsText(f,"utf-8")}});
function fallback(t){var ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;inset:20% 16px auto;height:50%;z-index:30;width:calc(100% - 32px)";document.body.appendChild(ta);ta.select();toast("حدّدتُ النص، انسخيه يدويًا ثم اضغطي خارج المربع");ta.addEventListener("blur",function(){ta.remove()})}
function shrinkImage(file,max){return new Promise(function(res,rej){var fr=new FileReader();fr.onerror=rej;fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
  var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/png"))};im.src=fr.result};fr.readAsDataURL(file)})}
function loadScript(src){return new Promise(function(res,rej){if(document.querySelector('script[src="'+src+'"]')){res();return}var sc=document.createElement("script");sc.src=src;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)})}
var downloadsNS=null;
function makePdf(btn){
  var old=btn.textContent;btn.disabled=true;btn.textContent="جارٍ تجهيز PDF…";
  var done=function(){btn.disabled=false;btn.textContent=old};
  Promise.all([loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]).then(function(){
    return (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
      var src=document.querySelector(".sheet"),host=document.createElement("div");
      host.className="pdfcap";host.style.cssText="position:fixed;top:0;left:-12000px;width:1040px;direction:rtl";
      host.appendChild(src.cloneNode(true));document.body.appendChild(host);
      var el=host.firstChild;
      return window.html2canvas(el,{scale:2,backgroundColor:"#ffffff",width:1040,windowWidth:1100,useCORS:true,scrollX:0,scrollY:0}).then(function(cv){host.remove();return cv},function(e){host.remove();throw e})})
  }).then(function(canvas){
    var pdf=new window.jspdf.jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    var pw=210,ph=297,m=8,iw=pw-2*m,ih=canvas.height*iw/canvas.width;
    if(ih>ph-2*m){ih=ph-2*m;iw=canvas.width*ih/canvas.height}
    pdf.addImage(canvas.toDataURL("image/jpeg",0.95),"JPEG",(pw-iw)/2,m,iw,ih);
    var d=data(),w=curWeek(d),c=d.classes.filter(function(x){return x.id===state.cls})[0];
    var name="خطة التعلم الأسبوعية - "+(c?c.grade:"")+" - الأسبوع "+(w?w.num:"")+".pdf";
    var blob=pdf.output("blob");
    return (window.claude&&window.claude.use?window.claude.use("downloads"):Promise.resolve(null)).then(function(dl){
      if(!dl){pdf.save(name);toast("تم حفظ ملف PDF");return}
      return dl.save({filename:name,data:blob}).then(function(){toast("تم حفظ ملف PDF")},function(err){if(err&&err.code!=="declined")toast("تعذّر حفظ الملف")})})
  }).then(done,function(){done();toast("تعذّر تجهيز PDF. جرّبي «نسخة للطباعة»")})}
function publish(){
  if(!artifactNS){toast("النشر متاح لصاحبة الصفحة فقط");return}
  var d=clone(draft);d.updated=new Date().toISOString();
  var btn=document.querySelector('[data-act="publish"]');if(btn){btn.disabled=true;btn.textContent="جارٍ النشر…"}
  artifactNS.publish(buildDoc(d)).then(function(){lsSet(null)},function(err){
    if(btn){btn.disabled=false;btn.textContent="نعم، اعتمدي وانشري"}
    var c=err&&err.code;toast(c==="conflict"?"نُشرت نسخة أحدث للتو. أعيدي فتح الصفحة ثم حاولي":c==="not_writer"||c==="not_granted"?"ليست لديك صلاحية النشر":"تعذّر النشر، حاولي مرة أخرى")})}

var h=(location.hash||"").slice(1);if(h)state.cls=h;
render();
if(window.claude&&window.claude.use){
  Promise.all([window.claude.use("user"),window.claude.use("artifact")]).then(function(res){
    var u=res[0];artifactNS=res[1];
    if(!u||!artifactNS)return;
    return u.canEdit().then(function(ok){canEdit=!!ok;if(canEdit){if(lsGet())toast("لديك مسودة غير منشورة. افتحي «إدارة الخطط»");render()}})
  }).catch(function(){});
}
})();
</script>
