<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}</style></head><body>
<title>سجل الشراكة المجتمعية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=El+Messiri:wght@500;600;700&display=swap">
<style>
/* Cover page with section tiles, then one section at a time; warm copper accent for partnership, calm sage base */
:root{--bg:#F4F5F1;--card:#fff;--fg:#25302C;--muted:#69766F;--line:#DDE3DD;--sage:#3F7766;--sage-2:#E6EFEA;--cu:#A0623A;--cu-2:#F6E9DF;
 --good:#3C7D5B;--good-bg:#E2F1E7;--warn:#9A6E22;--warn-bg:#F8EFDB;--info:#4F6E91;--info-bg:#E5ECF4;--bad:#B4574B;--bad-bg:#F7E6E2;
 --display:"El Messiri","IBM Plex Sans Arabic",Tahoma,sans-serif;--body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A18;--card:#1C2421;--fg:#E3ECE7;--muted:#9AAEA5;--line:#2C3833;--sage:#7DBBA5;--sage-2:#1F2E29;--cu:#E5A97E;--cu-2:#2D241D;--good:#86CDA4;--good-bg:#1A3024;--warn:#E3BF73;--warn-bg:#352B17;--info:#9DB8DA;--info-bg:#1E2836;--bad:#E7988D;--bad-bg:#3A2522;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141A18;--card:#1C2421;--fg:#E3ECE7;--muted:#9AAEA5;--line:#2C3833;--sage:#7DBBA5;--sage-2:#1F2E29;--cu:#E5A97E;--cu-2:#2D241D;--good:#86CDA4;--good-bg:#1A3024;--warn:#E3BF73;--warn-bg:#352B17;--info:#9DB8DA;--info-bg:#1E2836;--bad:#E7988D;--bad-bg:#3A2522;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.75;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1100px;margin:0 auto;padding-block:max(16px,env(safe-area-inset-top,0px)) 56px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-size:26px;margin:0;line-height:1.35}h2{font-family:var(--display);font-size:19px;margin:0}h3{margin:0 0 4px;font-size:15.5px;color:var(--sage)}
.lead{color:var(--muted);margin:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.top img{width:44px;background:#fff;border-radius:10px;padding:2px}
.top b{font-family:var(--display);font-size:17px;flex:1}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;width:100%}
.nav button{flex:none;border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:13.5px;padding:6px 14px;border-radius:999px;cursor:pointer}
.nav button[aria-current="page"]{background:var(--card);color:var(--cu);border-color:var(--line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cover{position:relative;overflow:hidden;border-radius:24px;padding:38px 22px 0;color:#fff;text-align:center;
 background:radial-gradient(110% 90% at 100% 0%,#C98B5E 0%,transparent 55%),radial-gradient(90% 80% at 0% 100%,#5E9C86 0%,transparent 60%),linear-gradient(135deg,#7A4A2C,#2F5A4D)}
.cover::after{content:"";position:absolute;inset:auto auto -100px -70px;width:300px;height:300px;border-radius:50%;border:40px solid rgba(255,255,255,.07)}
.cover>*{position:relative;z-index:1}
.cover img{width:92px;background:#fff;border-radius:18px;padding:6px}
.cover .k{margin:10px 0 0;font-size:13.5px;opacity:.88}
.cover h1{color:#fff;font-size:clamp(30px,6vw,46px);margin:2px 0}
.cover .s{margin:0;opacity:.92}
.cover .q{max-width:720px;margin:14px auto 0;font-size:14px;opacity:.9;font-style:italic}
.who{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:14px}
.who span{display:flex;flex-direction:column;font-size:12.5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:8px 16px}
.who b{font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:24px -22px 0;background:rgba(0,0,0,.16);border-top:1px solid rgba(255,255,255,.15)}
.stats div{display:flex;flex-direction:column;padding:12px 6px;font-size:12.5px}.stats div+div{border-inline-start:1px solid rgba(255,255,255,.15)}
.stats b{font-family:var(--display);font-size:25px;line-height:1.2}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.stats div:nth-child(3){border-inline-start:0}.stats div:nth-child(n+3){border-top:1px solid rgba(255,255,255,.15)}}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tile{display:flex;align-items:center;gap:14px;text-align:right;padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(60,40,20,.45);border-color:var(--tc)}
.tile .ti{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:var(--tc);background:var(--tb)}
.tile .tt{display:flex;flex-direction:column;flex:1}.tile b{font-family:var(--display);font-size:18px}.tile small{color:var(--muted);font-size:13px;line-height:1.5}.tile em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--tc)}
.tile.feat{grid-column:1/-1;background:linear-gradient(135deg,var(--cu-2),var(--card));border-color:var(--cu)}
.c1{--tc:#A0623A;--tb:#F6E9DF}.c2{--tc:#3C7D5B;--tb:#E2F1E7}.c3{--tc:#4F6E91;--tb:#E5ECF4}.c4{--tc:#7A5AA6;--tb:#EFE8F7}.c5{--tc:#9A6E22;--tb:#F8EFDB}.c6{--tc:#2F7C86;--tb:#E0F0F1}.c7{--tc:#B4574B;--tb:#F7E6E2}.c8{--tc:#3C7D5B;--tb:#E2F1E7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tile{--tb:rgba(255,255,255,.06)}}
:root[data-theme="dark"] .tile{--tb:rgba(255,255,255,.06)}
details.acc{background:var(--card);border:1px solid var(--line);border-radius:14px}
details.acc summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
details.acc summary::-webkit-details-marker{display:none}details.acc summary::after{content:"+";color:var(--muted)}details.acc[open] summary::after{content:"–"}
details.acc .b{padding:0 16px 14px}
ul.l,ol.l{margin:0;padding-inline-start:22px}ul.l li,ol.l li{margin:3px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12.5px;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.info{background:var(--info-bg);color:var(--info)}.pill.mut{background:var(--sage-2);color:var(--muted)}.pill.cu{background:var(--cu-2);color:var(--cu)}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:14px;font-weight:600;padding:7px 14px;border-radius:10px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--cu);border-color:var(--cu);color:#fff}.btn.sm{font-size:12.5px;padding:3px 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;min-width:0}
textarea{width:100%;min-height:70px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--cu);outline-offset:2px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table.g{border-collapse:collapse;width:100%;font-size:14px}
table.g th,table.g td{border-bottom:1px solid var(--line);padding:8px;text-align:center}
table.g th{background:var(--sage-2);font-weight:600;font-size:13px}table.g td.r{text-align:right}
.ccard{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card)}
.ccard .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ccard b.t{font-family:var(--display);font-size:18px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:14px}.facts dt{color:var(--muted)}.facts dd{margin:0}
.empty{color:var(--muted);text-align:center;padding:26px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(15,15,10,.6);overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:760px;background:var(--card);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:12px;z-index:60}
.thanks{background:linear-gradient(135deg,var(--cu-2),var(--card));border-color:transparent}
.plist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.plist div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.plist b{font-family:var(--display);font-size:16px;display:block}
.evh{font-size:13px;font-weight:600;color:var(--sage);margin:2px 0 -2px}
.evg{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.evg figure{margin:0;position:relative;min-width:0}
.evb{display:block;width:100%;aspect-ratio:4/3;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);cursor:zoom-in}
.evb img{width:100%;height:100%;object-fit:cover;display:block}
.evp{display:grid;place-items:center;font-size:30px;color:var(--cu)}
.evg figcaption{font-size:12px;color:var(--muted);text-align:center;line-height:1.4;margin-top:3px}
.evx{position:absolute;top:4px;left:4px;border:0;border-radius:999px;min-width:24px;height:24px;padding:0 6px;background:rgba(0,0,0,.62);color:#fff;font:inherit;font-size:12px;cursor:pointer}
.evadd{aspect-ratio:4/3;border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:13px;padding-bottom:24px}
/* printable form 5 */
#print{display:none}
@media print{body{background:#fff;padding:0}main,footer,.ov,.toast,.top{display:none!important}#print{display:block;color:#000;font-family:Arial,sans-serif;font-size:13px;direction:rtl}
 #print table{width:100%;border-collapse:collapse;margin:8px 0}#print td,#print th{border:1px solid #555;padding:6px;text-align:right;vertical-align:top}#print th{background:#eee;width:26%}
 #print .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #3F7766;padding-bottom:6px;margin-bottom:10px}#print img{width:90px}#print h2{text-align:center;font-size:17px;margin:6px 0}}
</style>

 for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),v=p.getViewport({scale:W/p.getViewport({scale:1}).width*dpr}),c=document.createElement("canvas");c.width=v.width;c.height=v.height;c.style.cssText="display:block;width:100%;margin:0 0 8px;border:1px solid var(--line);border-radius:8px;background:#fff";pv.appendChild(c);await p.render({canvasContext:c.getContext("2d"),viewport:v}).promise}
