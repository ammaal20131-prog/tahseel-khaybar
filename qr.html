<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>رموز أقسام ملف التحصيل</title>
<style>
  :root { --ink: #0f3d3c; --bg: #f5f7f6; }
  body { margin: 0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 20px 16px 8px; text-align: center; }
  h1 { font-size: 1.3rem; margin: 0 0 6px; }
  p { margin: 0; color: #555; font-size: .92rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; padding: 16px; max-width: 1100px; margin: 0 auto; }
  figure { margin: 0; background: #fff; border-radius: 12px; padding: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); text-align: center; }
  figure img { width: 100%; height: auto; display: block; border-radius: 6px; }
  figure a { display: inline-block; margin-top: 8px; color: var(--ink); font-weight: 600; text-decoration: none; font-size: .9rem; }
  .actions { text-align: center; padding: 0 16px; }
  button { font: inherit; background: var(--ink); color: #fff; border: 0; border-radius: 8px; padding: 8px 18px; cursor: pointer; }
  @media print {
    header p, .actions, figure a { display: none; }
    body { background: #fff; }
    .grid { display: block; padding: 0; }
    figure { box-shadow: none; padding: 0; page-break-after: always; }
    figure img { max-height: 100vh; width: auto; margin: 0 auto; }
  }
</style>
</head>
<body>
<header>
  <h1>رموز QR لأقسام ملف لجنة التحصيل الدراسي</h1>
  <p>كل رمز يفتح القسم في الموقع مباشرة (بعد تسجيل الدخول). اضغطي «تنزيل» لحفظ الصورة، أو اطبعي الصفحة: كل رمز في ورقة.</p>
</header>
<div class="actions"><button onclick="print()">طباعة الكل</button></div>
<div class="grid" id="g"></div>
<script>
  const Q = [
    ['01-remedial', 'الخطط العلاجية والإثرائية'],
    ['02-satisfaction', 'قياس رضا أولياء الأمور'],
    ['03-weekly', 'الخطط الأسبوعية'],
    ['04-semester', 'الخطط الفصلية'],
    ['05-period_tests', 'تحليل نتائج اختبارات الفترة'],
    ['06-diagnostic', 'تحليل نتائج الاختبار التشخيصي'],
    ['07-learning_styles', 'أنماط التعلم'],
    ['08-committee', 'الشواهد والتقارير العامة للجنة'],
    ['09-nafes', 'نافس – الاختبارات الوطنية'],
  ];
  document.getElementById('g').innerHTML = Q.map(([f, t]) =>
    `<figure><img src="assets/qr/${f}.png" alt="رمز QR: ${t}" loading="lazy"><a href="assets/qr/${f}.png" download="QR - ${t}.png">تنزيل: ${t}</a></figure>`).join('');
</script>
</body>
</html>
